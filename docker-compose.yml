services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - dbdata:/var/lib/mysql
    # not published to the host: only the other containers reach the database
    expose: ["3306"]

  migrate:
    build: ./backend
    entrypoint: ["/migrate"]
    env_file: .env
    environment:
      DB_HOST: db
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./migrations:/migrations:ro
    depends_on: [db]
    restart: on-failure

  api:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: db
      TRUST_PROXY: "1"   # the api sits behind the nginx service below
    depends_on: [migrate]
    expose: ["8080"]

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on: [api]
    expose: ["3000"]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    ports: ["80:80", "443:443"]
    depends_on: [web, api]

volumes:
  dbdata:
