services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - dbdata:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports: ["3306:3306"]

  api:
    build: ./backend
    env_file: .env
    depends_on: [db]
    ports: ["8080:8080"]

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  dbdata:
