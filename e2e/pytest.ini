[pytest]
# Default target: the Vercel mockup (NEXT_PUBLIC_MOCK=1). Override with --base-url http://localhost:3000
base_url = https://e-agm-one.vercel.app
testpaths = .
# screenshot + Playwright trace of every failed test land in test-results/ (open a trace: playwright show-trace <zip>)
addopts = --browser chromium --screenshot only-on-failure --tracing retain-on-failure --output test-results
markers =
    holder: shareholder flows (drawio pages 1-5)
    staff: staff console (drawio pages 6-12)
    admin: admin console (drawio pages 13-16)
